# Custom YOLO26 with Inception-ResNet-V2

nc: 80
end2end: True
reg_max: 1

scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]
  # args for InceptionResNetV2Backbone: [c2_hint, out_channels, num_a, num_b, num_c]
  - [-1, 1, InceptionResNetV2Backbone, [1024, [256, 512, 1024], 5, 10, 5]]  # 0
  - [0,  1, Index, [256, 0]]            # 1 - P3
  - [0,  1, Index, [512, 1]]            # 2 - P4
  - [0,  1, Index, [1024, 2]]           # 3 - P5
  - [-1, 1, SPPF, [1024, 5, 3, True]]   # 4
  - [-1, 2, C2PSA, [1024]]              # 5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 6
  - [[-1, 2], 1, Concat, [1]]                     # 7  (cat with P4)
  - [-1, 2, C3k2, [512, True]]                    # 8
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 9
  - [[-1, 1], 1, Concat, [1]]                     # 10 (cat with P3)
  - [-1, 2, C3k2, [256, True]]                    # 11 (P3 out)
  - [-1, 1, Conv, [256, 3, 2]]                    # 12
  - [[-1, 8], 1, Concat, [1]]                     # 13
  - [-1, 2, C3k2, [512, True]]                    # 14 (P4 out)
  - [-1, 1, Conv, [512, 3, 2]]                    # 15
  - [[-1, 5], 1, Concat, [1]]                     # 16
  - [-1, 1, C3k2, [1024, True, 0.5, True]]        # 17 (P5 out)
  - [[11, 14, 17], 1, Detect, [nc]]               # 18